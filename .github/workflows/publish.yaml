jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      run-coverage: false
  publish:
    environment: pypi
    name: Publish to PyPI
    needs: test
    permissions:
      contents: read # job-level permissions reset all unlisted scopes to none
      id-token: write # required for trusted publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: uv sync
      - name: Build package
        run: uv build --all-packages
      - name: Publish to PyPI
        run: uv publish
  release-notes:
    needs: publish
    permissions:
      contents: write # creates the draft release
    secrets: inherit # ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
    uses: ./.github/workflows/release-notes.yaml
    with:
      docs-url: https://bsure-analytics.github.io/flechtwerk/
      project: >-
        It releases two PyPI distributions, flechtwerk and flechtctl, and its readers are
        users of the framework.
name: Publish to PyPI
on:
  push:
    tags: [ 'v*.*.*' ]
