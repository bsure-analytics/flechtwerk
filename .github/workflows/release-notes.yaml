# Reusable: drafts the GitHub release for a pushed vX.Y.Z tag with the
# Claude Code CLI. Call it from a tag-push workflow, after the publish job:
#
#   release-notes:
#     needs: publish
#     permissions:
#       contents: write # creates the draft release
#     secrets: inherit # ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN
#     uses: bsure-analytics/flechtwerk/.github/workflows/release-notes.yaml@main
#     with:
#       project: It releases the PyPI distribution foo, read by users of the library.
#
# Claude only gets read-only `git` commands plus file writes; creating the
# release is the plain shell step's job. The release is a DRAFT — review and
# publish it by hand.
jobs:
  release-notes:
    name: Draft release notes
    permissions:
      contents: write # creates the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the notes cover every commit since the previous tag
          ref: ${{ inputs.tag || github.ref_name }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        id: range
        name: Collect context
        run: |
          # The first release of a repository covers everything since the root commit.
          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$TAG^" 2>/dev/null \
            || git rev-list --max-parents=0 "$TAG" | tail -n 1)
          mkdir -p .release
          touch .release/examples.md
          # The three latest published releases serve as the style reference.
          for t in $(gh release list --exclude-drafts --limit 3 --json tagName -q '.[].tagName'); do
            gh release view "$t" --json name,body -q '"# " + .name + "\n\n" + .body + "\n"' >> .release/examples.md
          done
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      # The Claude Code CLI, not anthropics/claude-code-action: the action
      # refuses a tag push ("Unsupported event type: push" — it accepts only
      # issue, pull-request, dispatch, schedule and workflow_run events).
      - env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
          MODEL: ${{ inputs.model }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: |
            Draft the GitHub release notes for ${{ inputs.tag || github.ref_name }} of this
            repository. ${{ inputs.project }} The release covers the commits
            ${{ steps.range.outputs.prev }}..${{ inputs.tag || github.ref_name }}: read them with
            `git log` and `git show`, and read the code and docs they touch until you
            understand what changed for a user of the project.

            .release/examples.md holds the notes of the latest releases (it is empty for a
            first release). Match their style exactly: a bold one-sentence verdict on
            compatibility (API, wire format, behavior) opening a short first paragraph, then
            `## Added`, `## Changed`, `## Fixed`, `## Removed` and `## Caveats` sections as
            needed, in that order, each entry starting with a bold lead-in sentence. Write for
            users of the project: explain what changed and why it matters to them, with short
            code samples where they help, not a list of commits. Leave out test-only and
            CI-only changes unless they change a guarantee a user relies on.
            ${{ inputs.docs-url && format('Link the docs site ({0}) where a page covers the topic.', inputs.docs-url) || '' }}

            Write exactly two files and nothing else:
            - .release/title.txt: one line, `${{ inputs.tag || github.ref_name }} — <headline>`,
              the headline a few lowercase words naming what the release is about.
            - .release/notes.md: the body, without the title.
        name: Write release notes
        run: |
          # Export only the credential that is set: an empty one in the
          # environment is still a credential to the CLI.
          if [ -n "$OAUTH_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"; fi
          if [ -n "$API_KEY" ]; then export ANTHROPIC_API_KEY="$API_KEY"; fi
          if [ -z "$OAUTH_TOKEN$API_KEY" ]; then
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret."
            exit 1
          fi
          npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude -p "$PROMPT" --model "$MODEL" \
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        name: Create draft release
        run: |
          test -s .release/title.txt && test -s .release/notes.md
          gh release create "$TAG" --draft --verify-tag \
            --notes-file .release/notes.md --title "$(head -n 1 .release/title.txt)"
name: Draft release notes
on:
  workflow_call:
    inputs:
      claude-code-version:
        default: 2.1.319
        description: Exact @anthropic-ai/claude-code npm version to run.
        type: string
      docs-url:
        default: ''
        description: Docs site the notes link to where a page covers the topic; empty for none.
        type: string
      model:
        default: opus
        description: Model passed to `claude --model`.
        type: string
      project:
        description: >-
          One or two sentences telling Claude what the repository releases and who reads the
          notes, inserted into the prompt verbatim.
        required: true
        type: string
      tag:
        default: ''
        description: The vX.Y.Z tag to draft; defaults to the ref that triggered the caller.
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
