[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [
    { name = "Christian Schlichtherle" },
    { name = "Viktor Penev" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "joserfc~=1.7",
]
description = "Keyrings and flenc:/flsig: secret tokens for Flechtwerk, without the framework: a library and a command line tool."
dynamic = ["version"]
keywords = ["flechtwerk", "jwe", "jws", "keyring", "secrets"]
license = { text = "MIT" }
maintainers = [
    { name = "b.sure GmbH" },
]
name = "flechtctl"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
flechtctl = "flechtctl.cli:main"

[project.urls]
Documentation = "https://bsure-analytics.github.io/flechtwerk/guides/flechtctl/"
Homepage = "https://github.com/bsure-analytics/flechtwerk"
Issues = "https://github.com/bsure-analytics/flechtwerk/issues"
Repository = "https://github.com/bsure-analytics/flechtwerk"

[tool.hatch.build.targets.wheel]
packages = ["src/flechtctl"]

[tool.hatch.version]
raw-options = { root = ".." }
source = "vcs"
